<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chalkline 控制台</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f6f7f9; color: #1f2328;
    }
    .card {
      max-width: 640px; margin: 2rem; padding: 2.5rem 3rem;
      background: #fff; border: 1px solid #e4e7eb; border-radius: 14px;
      box-shadow: 0 8px 28px rgba(31, 35, 40, .06);
    }
    h1 { font-size: 1.6rem; margin: 0 0 .25rem; letter-spacing: .5px; }
    h1 span { color: #c2410c; }
    .tag { display: inline-block; font-size: .75rem; color: #666;
      border: 1px solid #d8dce2; border-radius: 999px; padding: .15rem .6rem; margin-bottom: 1.2rem; }
    p { line-height: 1.7; color: #444; margin: .6rem 0; }
    code { background: #f1f3f5; border-radius: 4px; padding: .1rem .35rem; font-size: .9em; }
    #status { margin-top: 1.2rem; font-size: .9rem; color: #666; }
    #status b { color: #157a3f; }
    @media (prefers-color-scheme: dark) {
      body { background: #14171a; color: #e6e8ea; }
      .card { background: #1b1f23; border-color: #2c3238; box-shadow: none; }
      p { color: #aab2bb; }
      code { background: #262b30; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Chalk<span>line</span> 墨线</h1>
    <span class="tag">M0 · 骨架已就绪</span>
    <p>规格驱动开发协作平台。本页为静态占位——控制台界面（console 模块）在 M2 交付。</p>
    <p>M0 已包含：工作流引擎核心判定、领域模型、数据库迁移与部署编排。
      API 经 nginx 以 TLS 暴露，例如 <code>curl -k https://localhost/api/v1/info</code>。</p>
    <p>下一步：M1 交付身份与目录（用户 / 产品 / 模块树 / 迭代与任务 REST API）。</p>
    <p id="status">后端状态检测中…</p>
  </main>
  <script>
    fetch('/api/v1/info')
      .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
      .then(info => {
        document.getElementById('status').innerHTML =
          '后端在线：<b>' + info.name + ' v' + info.version + '</b> · API ' + info.api + ' · 里程碑 ' + info.milestone;
      })
      .catch(() => {
        document.getElementById('status').textContent = '后端暂不可达，请检查 docker compose 服务状态。';
      });
  </script>
</body>
</html>
