# Chalkline 本地/私有部署：postgres + api + web + nginx（docs/structure.md）。
# 用法见 README「快速开始」：cp deploy/.env.example deploy/.env && docker compose up -d
name: chalkline

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:19-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chalkline}
    volumes:
      # postgres 18+ 镜像数据目录布局变更：卷必须挂 /var/lib/postgresql
      # （PGDATA 位于其下的版本化子目录，如 /var/lib/postgresql/19/docker）。
      # 挂旧路径 .../data 会导致数据不落盘/启动报错；≤17 的旧卷布局不兼容，需 pg_dump 迁移。
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chalk} -d ${POSTGRES_DB:-chalkline}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        GOPROXY: ${GOPROXY:-}
        GO_IMAGE: ${GO_IMAGE:-golang:1.26-alpine}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.23}
    environment:
      CHALKLINE_ADDR: ":8080"
      CHALKLINE_DATABASE_URL: postgres://${POSTGRES_USER:-chalk}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-chalkline}?sslmode=disable
      CHALKLINE_LOG_LEVEL: ${CHALKLINE_LOG_LEVEL:-info}
      CHALKLINE_JWT_SECRET: ${CHALKLINE_JWT_SECRET:-}
      CHALKLINE_SECRET_KEY: ${CHALKLINE_SECRET_KEY:-}
      CHALKLINE_ADMIN_USERNAME: ${CHALKLINE_ADMIN_USERNAME:-}
      CHALKLINE_ADMIN_PASSWORD: ${CHALKLINE_ADMIN_PASSWORD:-}
      # ---- 集成（integration 模块，M2）：全部可选 ----
      CHALKLINE_OUTBOUND_ALLOWLIST: ${CHALKLINE_OUTBOUND_ALLOWLIST:-}
      CHALKLINE_OUTLINE_BASE_URL: ${CHALKLINE_OUTLINE_BASE_URL:-}
      CHALKLINE_OUTLINE_TOKEN: ${CHALKLINE_OUTLINE_TOKEN:-}
      CHALKLINE_REDMINE_BASE_URL: ${CHALKLINE_REDMINE_BASE_URL:-}
      CHALKLINE_REDMINE_TOKEN: ${CHALKLINE_REDMINE_TOKEN:-}
      CHALKLINE_WEBHOOK_URL: ${CHALKLINE_WEBHOOK_URL:-}
      CHALKLINE_WEBHOOK_SECRET: ${CHALKLINE_WEBHOOK_SECRET:-}
      CHALKLINE_SMTP_HOST: ${CHALKLINE_SMTP_HOST:-}
      CHALKLINE_SMTP_PORT: ${CHALKLINE_SMTP_PORT:-25}
      CHALKLINE_SMTP_USERNAME: ${CHALKLINE_SMTP_USERNAME:-}
      CHALKLINE_SMTP_PASSWORD: ${CHALKLINE_SMTP_PASSWORD:-}
      CHALKLINE_SMTP_FROM: ${CHALKLINE_SMTP_FROM:-}
      CHALKLINE_SMTP_TLS: ${CHALKLINE_SMTP_TLS:-none}
      CHALKLINE_SMTP_TLS_SKIP_VERIFY: ${CHALKLINE_SMTP_TLS_SKIP_VERIFY:-false}
      CHALKLINE_NOTIFY_EMAILS: ${CHALKLINE_NOTIFY_EMAILS:-}
      CHALKLINE_OUTBOX_INTERVAL: ${CHALKLINE_OUTBOX_INTERVAL:-5s}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /healthz 只注册了 GET（chi 不为 GET 自动处理 HEAD），wget --spider 发 HEAD 会 405。
      # 用 --method=GET 显式发 GET 请求。
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--method=GET", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  web:
    # 控制台（console 模块，M2）：Vite 构建产物由本容器 nginx 托管（SPA try_files 回退）。
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.31-alpine}
    restart: unless-stopped

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.31-alpine}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ./certs:/etc/nginx/certs
    environment:
      CERT_CN: ${CERT_CN:-localhost}
      NGINX_HTTPS_PORT: ${NGINX_HTTPS_PORT:-443}
    entrypoint: ["/bin/sh", "/etc/nginx/entrypoint.sh"]
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
