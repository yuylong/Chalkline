# Chalkline 边缘 nginx：TLS 终止、静态前端、API/MCP 反代。
# 证书由 entrypoint.sh 首次启动时自动生成自签名证书（生产请替换为正式证书）。

server {
    listen 80;
    server_name _;

    # 预留 Let's Encrypt HTTP-01 校验路径（webroot 模式）：把 token 放到
    # deploy/certs/acme/.well-known/acme-challenge/ 即可通过校验（该目录由
    # entrypoint.sh 创建）。未启用 ACME 时目录为空，本配置不产生任何影响；
    # 目录缺失时仅返回 404，不影响 nginx 启动。
    location ^~ /.well-known/acme-challenge/ {
        root /etc/nginx/certs/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/chalkline.crt;
    ssl_certificate_key /etc/nginx/certs/chalkline.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 控制台静态资源（M0 为占位页，M2 起为 React SPA）。
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # REST API。
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SSE 事件流（M3 实时推送）：关闭缓冲、拉长读超时，保持长连接。
    location /api/v1/events {
        proxy_pass http://api:8080/api/v1/events;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # MCP 端点（M1 起由 api 提供）。
    location /mcp {
        proxy_pass http://api:8080/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 健康检查直通。
    location = /healthz {
        proxy_pass http://api:8080/healthz;
    }
    location = /readyz {
        proxy_pass http://api:8080/readyz;
    }
}
