# web 容器：托管控制台 SPA 静态产物（console.md「数据」）。
# SPA 路由回退由本层处理（tech.md：Go 进程与边缘 nginx 不承担前端路由）。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由：未命中的路径回退 index.html 交给前端路由。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容 hash 的构建产物：长缓存。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 禁止隐藏文件。
    location ~ /\. {
        deny all;
    }
}
